kind: SpanAttrJSONParsingProcessor
name: Parse Span Attribute as JSON
style: processor
type: base
status: development
version: v0.0.1
summary: Parses span attribute JSON string value into individual attributes
description: Flattens a specified span attribute containing JSON string value into individual attributes on the span. Spans continue unchanged if attribute is missing or invalid JSON.
tags:
  - category:processor
  - service:collector
  - signal:OTelTraces
  - input:Traces
  - output:Traces
ports:
  # inputs
  - name: Traces
    direction: input
    type: OTelTraces
  # outputs
  - name: Traces
    direction: output
    type: OTelTraces
properties:
  - name: Attribute
    type: string
    summary: "The attribute to parse and convert to attributes"
    validations:
      - noblanks
templates:
  - kind: collector_config
    name: otel_filter
    format: collector
    meta:
      componentSection: processors
      signalTypes: [traces]
      collectorComponentName: transform
    data:
      - key: "{{ .ComponentName }}.error_mode"
        value: "ignore"
      - key: "{{ .ComponentName }}.trace_statements[0].conditions[0]"
        value: 'span.attributes["{{ .Values.Attribute }}"] != nil and HasPrefix(span.attributes["{{ .Values.Attribute }}"], "{")'
      - key: "{{ .ComponentName }}.trace_statements[0].statements[0]"
        value: 'set(span.cache, ParseJSON(span.attributes["{{ .Values.Attribute }}"]))'
      - key: "{{ .ComponentName }}.trace_statements[0].statements[1]"
        value: "flatten(span.cache)"
      - key: "{{ .ComponentName }}.trace_statements[0].statements[2]"
        value: 'merge_maps(span.attributes, span.cache, "upsert")'
