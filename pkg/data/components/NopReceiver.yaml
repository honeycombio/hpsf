kind: NopReceiver
name: Receive Nothing
version: v0.1.0
style: receiver
logo: opentelemetry
type: base
status: development
summary: Receives no signals and performs no operations (no-op receiver for testing)
description: Performs no operations on input signals. Required for minimal collector configurations and useful for testing receiver functionality.
tags:
  - category:input
  - service:collector
  - signal:OTelTraces
  - signal:OTelMetrics
  - signal:OTelLogs
  - input:Traces
  - input:Logs
  - input:Metrics
ports:
  # inputs
  - name: Traces
    direction: input
    type: OTelTraces
  - name: Logs
    direction: input
    type: OTelLogs
  - name: Metrics
    direction: input
    type: OTelMetrics
templates:
  - kind: collector_config
    name: nop_receiver_collector
    format: collector
    meta:
      componentSection: receivers
      signalTypes: [traces, metrics, logs]
      collectorComponentName: nop
    data:
      - key: "{{ .ComponentName }}"
        value: {}
