kind: ForceSpanScope
name: Set Span Scope
style: condition
type: base
status: alpha
version: v0.1.0
summary: Forces Refinery rule scope to span level instead of trace level.
description: Forces rule scope to span level, requiring all conditions to match on the same span rather than matching any condition across any span in the trace.
tags:
  - category:condition
  - service:refinery
  - vendor:Honeycomb
  - type:error
  - input:SampleData
  - output:SampleData
ports:
  # inputs
  - name: Match
    direction: input
    type: SampleData
  # outputs
  - name: And
    direction: output
    type: SampleData
templates:
  - kind: refinery_rules
    name: ForceSpanScope
    format: rules
    meta:
      condition: true
      scope: span
