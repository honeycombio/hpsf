kind: FieldContainsCondition
name: Check That Field Contains a Substring
style: condition
type: base
status: alpha
version: v0.1.0
summary: Checks if a field contains a specific substring
description: Performs case-sensitive substring matching across span fields. Useful for pattern matching within string values like URLs, messages, or service names.
tags:
  - category:condition
  - service:refinery
  - vendor:Honeycomb
  - type:error
  - input:SampleData
  - output:SampleData
ports:
  # inputs
  - name: Match
    direction: input
    type: SampleData
  # outputs
  - name: And
    direction: output
    type: SampleData
properties:
  - name: Field
    summary: The name of the field to check. If this field exists in any span of a trace, and its value contains the specified substring, the condition will match.
    description: |
      The field name to check for the substring.
    type: string
    validations:
      - noblanks
  - name: Substring
    summary: The substring to check against the field value.
    description: |
      The substring that the field value should contain.
    type: string
    validations:
      - noblanks
templates:
  - kind: refinery_rules
    name: FieldContainsCondition
    format: rules
    meta:
      condition: true
    data:
      - key: Field
        value: "{{ .Values.Field }}"
      - key: Operator
        value: contains
      - key: Value
        value: "{{ .Values.Substring }}"
      - key: Datatype
        value: string
