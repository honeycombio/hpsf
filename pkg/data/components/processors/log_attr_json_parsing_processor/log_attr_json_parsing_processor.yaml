kind: LogAttrJSONParsingProcessor
name: Parse Log Attribute as JSON
style: processor
type: base
status: beta
version: v0.0.1
summary: Parses log attribute JSON string values into individual attributes
description: |
  Flattens a specified log attribute containing a JSON string value into individual attributes on the log. Logs continue unchanged if attribute is missing or invalid JSON.
tags:
  - category:processor
  - service:collector
  - signal:OTelLogs
  - input:Logs
  - output:Logs
ports:
  # inputs
  - name: Logs
    direction: input
    type: OTelLogs
  # outputs
  - name: Logs
    direction: output
    type: OTelLogs
properties:
  - name: Attribute
    type: string
    summary: "The attribute to parse and convert to attributes"
    validations:
      - noblanks
templates:
  - kind: collector_config
    name: otel_filter
    format: collector
    meta:
      componentSection: processors
      signalTypes: [logs]
      collectorComponentName: transform
    data:
      - key: "{{ .ComponentName }}.error_mode"
        value: "ignore"
      - key: "{{ .ComponentName }}.log_statements[0].conditions[0]"
        value: "log.attributes[\"{{ .Values.Attribute }}\"] != nil and HasPrefix(log.attributes[\"{{ .Values.Attribute }}\"], \"{\")"
      - key: "{{ .ComponentName }}.log_statements[0].statements[0]"
        value: "set(log.cache, ParseJSON(log.attributes[\"{{ .Values.Attribute }}\"]))"
      - key: "{{ .ComponentName }}.log_statements[0].statements[1]"
        value: "flatten(log.cache)"
      - key: "{{ .ComponentName }}.log_statements[0].statements[2]"
        value: "merge_maps(log.attributes, log.cache, \"upsert\")"
