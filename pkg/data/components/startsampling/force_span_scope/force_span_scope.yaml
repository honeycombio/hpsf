kind: ForceSpanScope
name: Set Span Scope
style: condition
type: base
status: beta
version: v0.1.0
summary: Forces Refinery rule scope to span level instead of trace level.
description: |
  Changes evaluation from trace-wide to per-span, requiring all conditions match on a single span. Use when filtering specific span types within multi-span traces.
tags:
  - category:condition
  - service:refinery
  - vendor:Honeycomb
  - type:error
  - input:SampleData
  - output:SampleData
ports:
  # inputs
  - name: Match
    direction: input
    type: SampleData
  # outputs
  - name: And
    direction: output
    type: SampleData
templates:
  - kind: refinery_rules
    name: ForceSpanScope
    format: rules
    meta:
      condition: true
      scope: span
