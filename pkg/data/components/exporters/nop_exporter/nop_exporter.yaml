kind: NopExporter
name: Export Nothing
version: v0.1.0
style: exporter
logo: opentelemetry
type: base
status: development
summary: Exports nothing, useful for testing minimal collector configurations
description: No-operation exporter that discards all telemetry. Required for minimal collector setups where signal processing is needed without data export.
tags:
  - category:output
  - service:collector
  - signal:OTelTraces
  - signal:OTelMetrics
  - signal:OTelLogs
  - input:Traces
  - input:Logs
  - input:Metrics
ports:
  # inputs
  - name: Traces
    direction: input
    type: OTelTraces
  - name: Logs
    direction: input
    type: OTelLogs
  - name: Metrics
    direction: input
    type: OTelMetrics
templates:
  - kind: collector_config
    name: nop_exporter_collector
    format: collector
    meta:
      componentSection: exporters
      signalTypes: [traces, metrics, logs]
      collectorComponentName: nop
    data:
      - key: "{{ .ComponentName }}"
        value: {}
