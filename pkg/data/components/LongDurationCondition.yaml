kind: LongDurationCondition
name: Check Span Duration
style: condition
type: base
status: alpha
version: v0.1.0
summary: Checks if any span duration exceeds a specified threshold
description: Evaluates duration_ms field across spans to identify slow operations. Useful for sampling long-running requests at higher rates to debug performance issues.
tags:
  - category:condition
  - service:refinery
  - vendor:Honeycomb
  - type:error
  - input:SampleData
  - output:SampleData
ports:
  # inputs
  - name: Match
    direction: input
    type: SampleData
  # outputs
  - name: And
    direction: output
    type: SampleData
properties:
  - name: Duration
    type: int
    default: 1000
    validations:
      - positive
templates:
  - kind: refinery_rules
    name: LongDurationCondition
    format: rules
    meta:
      condition: true
    data:
      - key: Field
        value: duration_ms
      - key: Operator
        value: ">="
      - key: Value
        value: "{{ .Values.Duration | encodeAsInt }}"
      - key: Datatype
        value: int
