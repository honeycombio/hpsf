kind: LogSeverityFilterProcessor
name: Filter Logs by Severity
style: processor
type: base
status: alpha
version: v0.0.1
summary: Filters logs by severity level using configurable minimum threshold
description: Filters logs using the severity_number attribute to keep only entries at or above the specified severity level.
tags:
  - category:processor
  - service:collector
  - signal:OTelLogs
  - input:Logs
  - output:Logs
ports:
  # inputs
  - name: Logs
    direction: input
    type: OTelLogs
  # outputs
  - name: Logs
    direction: output
    type: OTelLogs
properties:
  - name: Severity
    type: string
    summary: The minimum severity level to keep.
    subtype: oneof(Trace,Debug,Info,Warn,Error)
    default: Warn
    validations:
      - oneof(Trace,Debug,Info,Warn,Error)
templates:
  - kind: collector_config
    name: otel_filter
    format: collector
    meta:
      componentSection: processors
      signalTypes: [logs]
      collectorComponentName: filter
    data:
      - key: "{{ .ComponentName }}.error_mode"
        value: "ignore"
      - key: "{{ .ComponentName }}.logs.log_record[0]"
        value: "severity_number < SEVERITY_NUMBER_{{ .Values.Severity | upper }}"
