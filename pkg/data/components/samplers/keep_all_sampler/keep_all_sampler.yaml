kind: KeepAllSampler
name: Keep All
style: sampler
type: base
status: beta
version: v0.1.0
summary: Keeps all traces without sampling.
description: Sets SamplingRate to 1 for complete trace collection. Use for low-volume, high-value telemetry such as errors.
tags:
  - category:sampler
  - service:refinery
  - vendor:Honeycomb
  - type:error
  - input:SampleData
  - output:Events
ports:
  # inputs
  - name: Sample
    direction: input
    type: SampleData
  # outputs
  - name: Events
    direction: output
    type: HoneycombEvents
templates:
  - kind: refinery_rules
    name: KeepAll_RefineryRules
    format: rules
    meta:
      sampler: DeterministicSampler
    data:
      - key: SampleRate
        value: 1
