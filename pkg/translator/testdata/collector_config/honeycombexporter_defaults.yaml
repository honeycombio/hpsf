receivers:
    otlp/otlp:
        protocols:
            grpc:
                endpoint: ${HTP_COLLECTOR_POD_IP}:4317
            http:
                endpoint: ${HTP_COLLECTOR_POD_IP}:4318
processors:
    memory_limiter/otlp:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
    usage: {}
exporters:
    otlphttp/honeycomb:
        endpoint: https://api.honeycomb.io:443
        headers:
            x-honeycomb-dataset: metrics
            x-honeycomb-team: ${HTP_EXPORTER_APIKEY}
        sending_queue:
            batch:
                flush_timeout: 200ms
                max_size: 8192
                min_size: 8192
            enabled: true
            queue_size: 100000
            sizer: items
    otlphttp/refinery:
        endpoint: http://${HTP_REFINERY_SERVICE}:80
        sending_queue:
            batch:
                flush_timeout: 200ms
                max_size: 8192
                min_size: 8192
            enabled: true
            queue_size: 100000
            sizer: items
        tls:
            insecure: true
connectors:
    forward/otlp/otlp: {}
extensions:
    honeycomb: {}
service:
    extensions: [honeycomb]
    pipelines:
        logs/b34-d67:
            receivers: [forward/otlp/otlp]
            processors: []
            exporters: [otlphttp/honeycomb]
        logs/ingress_otlp/otlp:
            receivers: [otlp/otlp]
            processors: [memory_limiter/otlp, usage]
            exporters: [forward/otlp/otlp]
        metrics/c4b-9f0:
            receivers: [forward/otlp/otlp]
            processors: []
            exporters: [otlphttp/honeycomb]
        metrics/ingress_otlp/otlp:
            receivers: [otlp/otlp]
            processors: [memory_limiter/otlp, usage]
            exporters: [forward/otlp/otlp]
        traces/abd-cdb:
            receivers: [forward/otlp/otlp]
            processors: []
            exporters: [otlphttp/refinery]
        traces/ingress_otlp/otlp:
            receivers: [otlp/otlp]
            processors: [memory_limiter/otlp, usage]
            exporters: [forward/otlp/otlp]
