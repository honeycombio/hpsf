components:
  - name: Receive OTel
    kind: OTelReceiver
    version: v0.1.0
  - name: Send to Honeycomb
    kind: HoneycombExporter
    version: v0.1.0
connections:
  - source:
      component: Receive OTel
      port: Traces
      type: OTelTraces
    destination:
      component: Send to Honeycomb
      port: Traces
      type: OTelTraces
