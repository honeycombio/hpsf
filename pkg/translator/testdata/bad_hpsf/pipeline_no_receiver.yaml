components:
  - name: Receive OTel
    kind: OTelReceiver
    version: v0.1.0
  - name: Mask sensitive values
    kind: RedactionProcessor
    version: v0.1.0
  - name: Send to Honeycomb
    kind: HoneycombExporter
    version: v0.1.0
connections:
  - source:
      component: Receive OTel
      port: Traces
      type: OTelTraces
    destination:
      component: Mask sensitive values
      port: Traces
      type: OTelTraces
  - source:
      component: Mask sensitive values
      port: Traces
      type: OTelTraces
    destination:
      component: Send to Honeycomb
      port: Traces
      type: OTelTraces
  - source:
      component: Mask sensitive values
      port: Metrics
      type: OTelMetrics
    destination:
      component: Send to Honeycomb
      port: Metrics
      type: OTelMetrics
