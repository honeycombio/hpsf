components:
  - name: otlp_in
    kind: OTelReceiver
  - name: otlp_out
    kind: OTelHTTPExporter
  - name: proguard_symbolicator
    kind: ProguardSymbolicationProcessor
    properties:
      - name: BucketName
        value: my-proguard-bucket
      - name: Region
        value: us-west-2
      - name: Prefix
        value: proguard-maps/
connections:
  - source:
      component: otlp_in
      port: Logs
      type: OTelLogs
    destination:
      component: proguard_symbolicator
      port: Logs
      type: OTelLogs
  - source:
      component: proguard_symbolicator
      port: Logs
      type: OTelLogs
    destination:
      component: otlp_out
      port: Logs
      type: OTelLogs
