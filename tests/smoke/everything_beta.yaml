      port: Traces
      type: OTelTraces
    destination:
      component: Start Sampling_1
      port: Traces
      type: OTelTraces
  - source:
      component: Transform Metrics with OTTL_1
      port: Metrics
      type: OTelMetrics
    destination:
      component: Send to stdout_1
      port: Metrics
      type: OTelMetrics
  - source:
      component: Start Sampling_1
      port: Rule 5
      type: SampleData
    destination:
