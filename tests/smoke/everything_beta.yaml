      port: Match
      type: SampleData
  - source:
      component: Check Boolean Value_1
      port: And
      type: SampleData
    destination:
      component: Keep All_1
      port: Sample
      type: SampleData
  - source:
      component: Parse Span Attribute as JSON_1
      port: Traces
      type: OTelTraces
    destination:
      component: Symbolicate JavaScript Web Errors_1
      port: Traces
      type: OTelTraces
  - source:
      component: Deduplicate Logs_1
      port: Logs
      type: OTelLogs
    destination:
      component: Symbolicate Java Android Errors_1
      port: Logs
      type: OTelLogs
  - source:
