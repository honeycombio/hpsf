      port: Logs
      type: OTelLogs
    destination:
      component: Symbolicate Swift iOS Errors_1
      port: Logs
      type: OTelLogs
  - source:
      component: Symbolicate Swift iOS Errors_1
      port: Logs
      type: OTelLogs
    destination:
      component: Transform Logs with OTTL_1
      port: Logs
      type: OTelLogs
  - source:
      component: Redact Sensitive Values_1
      port: Traces
      type: OTelTraces
    destination:
      component: Transform Traces with OTTL_1
      port: Traces
      type: OTelTraces
  - source:
      component: Receive OTel_1
      port: Traces
      type: OTelTraces
    destination:
      component: Filter Traces by Custom OTTL_1
      port: Traces
      type: OTelTraces
  - source:
      component: Start Sampling_1
      port: Rule 2
      type: SampleData
    destination:
      component: Check HTTP Status Code_1
      port: Match
      type: SampleData
  - source:
      component: Match Regular Expression_1
      port: And
      type: SampleData
    destination:
      component: Sample at 123_1
      port: Sample
      type: SampleData
  - source:
      component: Check Field Existence_1
      port: And
      type: SampleData
    destination:
      component: Check String Value_1
