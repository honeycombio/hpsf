  - source:
      component: Parse Span Attribute as JSON_1
      port: Traces
      type: OTelTraces
    destination:
      component: Symbolicate JavaScript Web Errors_1
      port: Traces
      type: OTelTraces
  - source:
      component: Start Sampling_1
      port: Rule 1
      type: SampleData
    destination:
      component: Compare String Field_1
      port: Match
      type: SampleData
  - source:
      component: Check Field Starts With_1
      port: And
      type: SampleData
    destination:
      component: Check List Comparison_1
      port: Match
      type: SampleData
  - source:
      component: Deduplicate Logs_1
      port: Logs
      type: OTelLogs
    destination:
      component: Symbolicate Swift iOS Errors_1
      port: Logs
      type: OTelLogs
  - source:
