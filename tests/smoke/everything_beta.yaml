components:
  - name: Receive OTel_1
    kind: OTelReceiver
  - name: Send OTel via gRPC_1
    kind: OTelGRPCExporter
    properties:
      - name: Headers
        value:
          test: header
      - name: Insecure
        value: true
  - name: Send OTel via HTTP_1
    kind: OTelHTTPExporter
    properties:
      - name: Headers
        value:
          test: header
      - name: Insecure
        value: true
  - name: Send to Honeycomb_1
    kind: HoneycombExporter
    properties:
      - name: Insecure
        value: true
  - name: Send to S3 Archive_1
    kind: S3ArchiveExporter
    properties:
      - name: Bucket
        value: test
      - name: Prefix
        value: test
  - name: Check Duration_1
    kind: LongDurationCondition
  - name: Filter Logs by Severity_1
    kind: LogSeverityFilterProcessor
  - name: Filter Logs by Custom OTTL_1
    kind: CustomLogFilterProcessor
    properties:
      - name: LogStatements
        value:
          - severity_number < SEVERITY_NUMBER_INFO
  - name: Keep All_1
    kind: KeepAllSampler
  - name: Parse Log Body As JSON_1
    kind: LogBodyJSONParsingProcessor
  - name: Sample by Events per Second_1
    kind: EMAThroughputSampler
    properties:
      - name: FieldList
        value:
          - test
  - name: Sample Proportionally by Key_1
    kind: EMADynamicSampler
    properties:
      - name: FieldList
        value:
          - test
  - name: Start Sampling_1
    kind: SamplingSequencer
    properties:
      - name: Headers
        value:
          test: header
      - name: UseTLS
        value: true
  - name: Parse Attribute As JSON_1
    kind: AttributeJSONParsingProcessor
    properties:
      - name: Attribute
        value: test
      - name: Signal
        value: span
  - name: Check HTTP Status_1
    kind: HTTPStatusCondition
  - name: Check HTTP Status Code_1
    kind: HTTPStatusCodeCondition
    properties:
      - name: Minimum
        value: 400
      - name: Maximum
        value: 599
  - name: Check Root Span_1
    kind: RootSpanCondition
  - name: Drop All_1
    kind: Dropper
  - name: Compare String Field_1
    kind: StringValueCondition
    properties:
      - name: Fields
        value:
          - status_message
      - name: Operator
        value: =
      - name: Value
        value: error
  - name: Check Numeric Value_1
    kind: NumericValueCondition
    properties:
      - name: Fields
        value:
          - response_time
      - name: Operator
        value: ">"
      - name: Value
        value: 1.5
  - name: Sample at 42_1
    kind: DeterministicSampler
    properties:
      - name: SampleRate
        value: 42
  - name: Match Regular Expression_1
    kind: MatchRegularExpression
    properties:
      - name: Field
        value: status_message
      - name: RegularExpression
        value: ^[A-Z][a-z]+$
  - name: Check Field Exists_1
    kind: FieldExistsCondition
    properties:
      - name: Field
        value: status_message
  - name: Check Field Starts With_1
    kind: StringValueCondition
    properties:
      - name: Fields
        value:
          - service.name
      - name: Operator
        value: starts-with
      - name: Value
        value: web
  - name: Check Boolean Value_1
    kind: BooleanValueCondition
    properties:
      - name: Fields
        value:
          - enabled
          - active
      - name: Value
        value: "true"
  - name: Sample at 123_1
    kind: DeterministicSampler
    properties:
      - name: SampleRate
        value: 123
  - name: Filter Traces by Custom OTTL_1
    kind: CustomTraceFilterProcessor
    properties:
      - name: SpanStatements
        value:
          - attributes["container.name"] == "container_1"
      - name: SpanEventStatements
        value:
          - name == "exception"
  - name: Filter Metrics by Custom OTTL_1
    kind: CustomMetricFilterProcessor
    properties:
      - name: MetricStatements
        value:
          - name == "http.server.duration"
      - name: DataPointStatements
        value:
          - attributes["service.name"] == "api"
  - name: Send to Enhance S3 Archive
    kind: EnhanceIndexingS3Exporter
    version: v0.1.0
    properties:
      - name: Bucket
        value: otel-demo
      - name: Region
        value: us-east-1
      - name: Prefix
        value: otel-demo
      - name: PartitionFormat
        value: minute=%M/year=%Y/month=%m/day=%d/hour=%H
      - name: Timeout
        value: 15s
      - name: Marshaler
        value: otlp_json
      - name: BatchTimeout
        value: 15s
      - name: BatchSize
        value: 497
      - name: QueueSize
        value: 4997
      - name: APIEndpoint
        value: https://api-dogfood.honeycomb.io
  - name: Deduplicate Logs_1
    kind: LogDeduplicationProcessor
  - name: Transform Metrics with OTTL_1
    kind: CustomMetricTransformProcessor
    properties:
      - name: MetricStatements
        value:
          - set(datapoint.attributes["processed"], "true")
  - name: Parse Log Attribute as JSON_1
    kind: LogAttrJSONParsingProcessor
    properties:
      - name: Attribute
        value: data
  - name: Parse Span Attribute as JSON_1
    kind: SpanAttrJSONParsingProcessor
    properties:
      - name: Attribute
        value: metadata
  - name: Symbolicate JavaScript Web Errors_1
    kind: SourcemapSymbolicationProcessor
    properties:
      - name: BucketName
        value: sourcemap-bucket
      - name: Region
        value: us-east-1
  - name: Symbolicate Java Android Errors_1
    kind: ProguardSymbolicationProcessor
    properties:
      - name: BucketName
        value: proguard-bucket
      - name: Region
        value: us-east-1
  - name: Symbolicate Swift iOS Errors_1
    kind: DsymSymbolicationProcessor
    properties:
      - name: BucketName
        value: dsym-bucket
      - name: Region
        value: us-east-1
  - name: Redact Sensitive Values_1
    kind: RedactionProcessor
  - name: Transform Logs with OTTL_1
    kind: CustomLogTransformProcessor
    properties:
      - name: LogStatements
        value:
          - set(log.attributes["processed"], "true")
  - name: Filter All Signals by OTTL_1
    kind: CustomFilterProcessor
    properties:
      - name: Signal
        value: traces
  - name: Transform Traces with OTTL_1
    kind: CustomTraceTransformProcessor
    properties:
      - name: TraceStatements
        value:
          - set(span.attributes["processed"], "true")
  - name: Check Field Existence_1
    kind: FieldExistenceCondition
    properties:
      - name: Fields
        value:
          - request_id
  - name: Check List Comparison_1
    kind: ListComparisonCondition
    properties:
      - name: Fields
        value:
          - status
      - name: Values
        value:
          - success
          - ok
          - complete
  - name: Send to stdout_1
    kind: DebugExporter
connections:
  - source:
      component: Receive OTel_1
      port: Traces
      type: OTelTraces
    destination:
      component: Parse Attribute As JSON_1
      port: Traces
      type: OTelTraces
  - source:
      component: Parse Attribute As JSON_1
      port: Traces
      type: OTelTraces
    destination:
      component: Filter Traces by Custom OTTL_1
      port: Traces
      type: OTelTraces
  - source:
      component: Start Sampling_1
      port: Rule 1
      type: SampleData
    destination:
      component: Check Duration_1
      port: Match
      type: SampleData
  - source:
      component: Keep All_1
      port: Events
      type: HoneycombEvents
    destination:
      component: Send to Honeycomb_1
      port: Events
      type: HoneycombEvents
  - source:
      component: Sample Proportionally by Key_1
      port: Events
      type: HoneycombEvents
    destination:
      component: Send to Honeycomb_1
      port: Events
      type: HoneycombEvents
  - source:
      component: Compare String Field_1
      port: And
      type: SampleData
    destination:
      component: Check Numeric Value_1
      port: Match
      type: SampleData
  - source:
      component: Check Numeric Value_1
      port: And
      type: SampleData
    destination:
      component: Sample at 42_1
      port: Sample
      type: SampleData
  - source:
      component: Sample at 42_1
      port: Events
      type: HoneycombEvents
    destination:
      component: Send to Honeycomb_1
      port: Events
      type: HoneycombEvents
  - source:
      component: Start Sampling_1
      port: Rule 3
      type: SampleData
    destination:
      component: Match Regular Expression_1
      port: Match
      type: SampleData
  - source:
      component: Match Regular Expression_1
      port: And
      type: SampleData
    destination:
      component: Check Field Exists_1
      port: Match
      type: SampleData
  - source:
      component: Check Field Exists_1
      port: And
      type: SampleData
    destination:
      component: Sample at 123_1
      port: Sample
      type: SampleData
  - source:
      component: Sample at 123_1
      port: Events
      type: HoneycombEvents
    destination:
      component: Send to Honeycomb_1
      port: Events
      type: HoneycombEvents
  - source:
      component: Start Sampling_1
      port: Rule 2
      type: SampleData
    destination:
      component: Check HTTP Status_1
      port: Match
      type: SampleData
  - source:
      component: Check HTTP Status_1
      port: And
      type: SampleData
    destination:
      component: Check HTTP Status Code_1
      port: Match
      type: SampleData
  - source:
      component: Check HTTP Status Code_1
      port: And
      type: SampleData
    destination:
      component: Check Root Span_1
      port: Match
      type: SampleData
  - source:
      component: Check Root Span_1
      port: And
      type: SampleData
    destination:
      component: Sample by Events per Second_1
      port: Sample
      type: SampleData
  - source:
      component: Sample by Events per Second_1
      port: Events
      type: HoneycombEvents
    destination:
      component: Send to Honeycomb_1
      port: Events
      type: HoneycombEvents
  - source:
      component: Receive OTel_1
      port: Metrics
      type: OTelMetrics
    destination:
      component: Filter Metrics by Custom OTTL_1
      port: Metrics
      type: OTelMetrics
  - source:
      component: Parse Log Body As JSON_1
      port: Logs
      type: OTelLogs
    destination:
      component: Filter Logs by Severity_1
      port: Logs
      type: OTelLogs
  - source:
      component: Receive OTel_1
      port: Logs
      type: OTelLogs
    destination:
      component: Parse Log Body As JSON_1
      port: Logs
      type: OTelLogs
  - source:
      component: Filter Logs by Severity_1
      port: Logs
      type: OTelLogs
    destination:
      component: Filter Logs by Custom OTTL_1
      port: Logs
      type: OTelLogs
  - source:
      component: Filter Logs by Custom OTTL_1
      port: Logs
      type: OTelLogs
    destination:
      component: Parse Log Attribute as JSON_1
      port: Logs
      type: OTelLogs
  - source:
      component: Parse Log Attribute as JSON_1
      port: Logs
      type: OTelLogs
    destination:
      component: Deduplicate Logs_1
      port: Logs
      type: OTelLogs
  - source:
      component: Transform Logs with OTTL_1
      port: Logs
      type: OTelLogs
    destination:
      component: Send to Enhance S3 Archive
      port: Logs
      type: OTelLogs
  - source:
      component: Filter Metrics by Custom OTTL_1
      port: Metrics
      type: OTelMetrics
    destination:
      component: Transform Metrics with OTTL_1
      port: Metrics
      type: OTelMetrics
  - source:
      component: Filter Traces by Custom OTTL_1
      port: Traces
      type: OTelTraces
    destination:
      component: Parse Span Attribute as JSON_1
      port: Traces
      type: OTelTraces
  - source:
      component: Symbolicate JavaScript Web Errors_1
      port: Traces
      type: OTelTraces
    destination:
      component: Redact Sensitive Values_1
      port: Traces
      type: OTelTraces
  - source:
