      port: Logs
      type: OTelLogs
    destination:
      component: Send to S3 Archive_1
      port: Logs
      type: OTelLogs
  - source:
      component: Transform Metrics with OTTL_1
      port: Metrics
      type: OTelMetrics
    destination:
      component: Send OTel via HTTP_1
      port: Metrics
      type: OTelMetrics
  - source:
      component: Transform Metrics with OTTL_1
      port: Metrics
      type: OTelMetrics
    destination:
